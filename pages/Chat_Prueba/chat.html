<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
</head>
<body style="display: flex; flex-direction: column; height: 100%;">
    <div>
        Inserte Id del usuario con el que quiera conversar
        <input type="text" id="inputNombre">
        <button onclick="buscarUsuarioPorNombre()">Buscar</button>
    </div>

    <div style="width: 100%;
    max-width: 700px;
    display: flex;
    align-items: flex-start;
    gap: 25px;
    flex-direction: row;">
    <div style="max-width: 80%;
    padding: 12px 18px;
    border-radius: 20px;
    position: relative;
    font-size: 15px;
    line-height: 1.6;">
    <div style="background: #ffdd59;
    color: #ffffff;
    border-bottom-right-radius: 5px;">
    <div id="mensajes">
    </div>
    </div>
    </div>
    </div>

    <div>
        Inserte un mensaje
        <input type="text" id="inputMensaje">
        <button onclick="insertarMensaje()">Enviar</button>
    </div>

    
</body>
<script src="chat.js"></script>
</html>
